<text x="587" y="193" text-anchor="middle" font-size="17" fill="#1a1a1a">weil</text>
<rect x="631" y="170" width="57" height="34" rx="4" fill="#147375"/>
<text x="660" y="193" text-anchor="middle" font-size="17" fill="#fff">sie</text>
<text x="30" y="254" font-size="13" fill="#666">Linienstärke = wie stark das Modell ein Wort beachtet (Beispielwerte)</text>
<text x="30" y="305" font-size="19" font-weight="bold" fill="#1a1a1a">2. Vorhersage: Welches Wort kommt als Nächstes?</text>
<text x="30" y="335" font-size="15" fill="#333">„Die Klientin holt den Bescheid ab, weil sie …“</text>
<text x="100" y="370" text-anchor="end" font-size="15" fill="#1a1a1a">ihn</text>
<rect x="110" y="355" width="414" height="19" fill="#147375"/>
<text x="532" y="370" font-size="14" fill="#333">46%</text>
<text x="100" y="396" text-anchor="end" font-size="15" fill="#1a1a1a">ihren</text>
