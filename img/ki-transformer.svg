<rect x="110" y="459" width="45" height="19" fill="#b3b3b3"/>
<text x="163" y="474" font-size="14" fill="#333">5%</text>
<text x="600" y="395" font-size="14" fill="#333"><tspan x="600">Ein Wort wird gewählt,</tspan><tspan x="600" dy="19">angehängt – und alles</tspan><tspan x="600" dy="19">beginnt von vorn.</tspan></text>
