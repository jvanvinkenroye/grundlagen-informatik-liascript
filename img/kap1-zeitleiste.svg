<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" font-family="Arial, Helvetica, sans-serif">
  <rect width="720" height="300" fill="#fff"/>
  <text x="360" y="40" text-anchor="middle" font-size="22" font-weight="bold" fill="#1a1a1a">Von der Idee zur Disziplin</text>

  <!-- Zeitstrahl -->
  <line x1="50" y1="160" x2="660" y2="160" stroke="#666" stroke-width="4"/>
  <polygon points="660,148 684,160 660,172" fill="#666"/>

  <g text-anchor="middle" fill="#1a1a1a">
    <circle cx="110" cy="160" r="14" fill="#2A9D8F" stroke="#2A9D8F" stroke-width="3"/>
    <text x="110" y="120" font-size="16" font-weight="bold">vor 1940</text>
    <text x="110" y="200" font-size="13">
      <tspan x="110">Rechenmaschinen</tspan><tspan x="110" dy="17">als Gedankenmodell</tspan>
    </text>

    <circle cx="260" cy="160" r="14" fill="#1F8A80" stroke="#1F8A80" stroke-width="3"/>
    <text x="260" y="120" font-size="16" font-weight="bold">1940er</text>
    <text x="260" y="200" font-size="13">
      <tspan x="260">erste elektronische</tspan><tspan x="260" dy="17">Rechner</tspan>
    </text>

    <circle cx="410" cy="160" r="14" fill="#147375" stroke="#147375" stroke-width="3"/>
    <text x="410" y="120" font-size="16" font-weight="bold">1960er</text>
    <text x="410" y="200" font-size="13">
      <tspan x="410">Informatik wird</tspan><tspan x="410" dy="17">Wissenschaft</tspan>
    </text>

    <circle cx="560" cy="160" r="14" fill="#264653" stroke="#264653" stroke-width="3"/>
    <text x="560" y="120" font-size="16" font-weight="bold">heute</text>
    <text x="560" y="200" font-size="13">
      <tspan x="560">Fachinformatiken,</tspan><tspan x="560" dy="17">z. B. Sozialinformatik</tspan>
    </text>
  </g>
</svg>
