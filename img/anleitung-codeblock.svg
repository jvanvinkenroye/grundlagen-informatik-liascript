<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 440" font-family="Arial, Helvetica, sans-serif">
  <rect width="860" height="440" fill="#fff"/>

  <!-- Editor -->
  <rect x="20" y="20" width="700" height="150" fill="#fff" stroke="#147375" stroke-width="2"/>
  <rect x="20" y="20" width="44" height="150" fill="#f0f0f0"/>
  <rect x="64" y="30" width="590" height="26" fill="#ececec"/>
  <g font-family="Menlo, Consolas, monospace" font-size="17">
    <g fill="#333" text-anchor="middle">
      <text x="42" y="49">1</text><text x="42" y="80">2</text>
      <text x="42" y="111">3</text><text x="42" y="142">4</text>
    </g>
    <text x="74" y="49" fill="#1a1a1a">zahl = <tspan fill="#1f3fbf">17</tspan></text>
    <line x1="170" y1="33" x2="170" y2="54" stroke="#333" stroke-width="2"/>
    <text x="74" y="111" fill="#3c8a5a"># Kommentar: wird nicht ausgeführt</text>
    <text x="74" y="142" fill="#1f3fbf">print<tspan fill="#1a1a1a">(zahl)</tspan></text>
  </g>
  <!-- Kopieren -->
  <rect x="682" y="32" width="14" height="16" fill="none" stroke="#147375" stroke-width="2"/>
  <rect x="688" y="27" width="14" height="16" fill="#fff" stroke="#147375" stroke-width="2"/>

  <!-- Steuerleiste -->
  <circle cx="44" cy="208" r="15" fill="#fff" stroke="#147375" stroke-width="2"/>
  <text x="44" y="213" text-anchor="middle" font-size="12" font-weight="bold" fill="#147375">&lt;/&gt;</text>
  <g fill="#999" font-size="20" text-anchor="middle">
    <text x="520" y="215">|&lt;</text><text x="565" y="215">&lt;</text>
    <text x="645" y="215">&gt;</text><text x="690" y="215">&gt;|</text>
  </g>
  <text x="605" y="216" text-anchor="middle" font-size="20" font-weight="bold" fill="#147375">1</text>

  <!-- Ausgabe -->
  <rect x="20" y="240" width="700" height="50" fill="#000"/>
  <text x="38" y="272" font-family="Menlo, Consolas, monospace" font-size="17" fill="#fff">17</text>

  <!-- Markierungen -->
  <g font-size="15" font-weight="bold" fill="#fff" text-anchor="middle">
    <circle cx="300" cy="80" r="15" fill="#264653"/><text x="300" y="85">1</text>
    <circle cx="90" cy="208" r="15" fill="#264653"/><text x="90" y="213">2</text>
    <circle cx="660" cy="265" r="15" fill="#264653"/><text x="660" y="270">3</text>
    <circle cx="605" cy="178" r="15" fill="#264653"/><text x="605" y="183">4</text>
    <circle cx="740" cy="38" r="15" fill="#264653"/><text x="740" y="43">5</text>
  </g>

  <!-- Legende -->
  <g font-size="15" fill="#1a1a1a">
    <g font-weight="bold" fill="#fff" text-anchor="middle">
      <circle cx="35" cy="325" r="12" fill="#264653"/><text x="35" y="330">1</text>
      <circle cx="35" cy="355" r="12" fill="#264653"/><text x="35" y="360">2</text>
      <circle cx="35" cy="385" r="12" fill="#264653"/><text x="35" y="390">3</text>
      <circle cx="445" cy="325" r="12" fill="#264653"/><text x="445" y="330">4</text>
      <circle cx="445" cy="375" r="12" fill="#264653"/><text x="445" y="380">5</text>
    </g>
    <text x="57" y="330"><tspan font-weight="bold">Editor:</tspan> hineinklicken und Code ändern</text>
    <text x="57" y="360"><tspan font-weight="bold">Ausführen:</tspan> runder Knopf &lt;/&gt; anklicken</text>
    <text x="57" y="390"><tspan font-weight="bold">Ausgabe:</tspan> Ergebnis im schwarzen Feld</text>
    <text x="467" y="330"><tspan font-weight="bold">Versionen:</tspan> zu früheren Fassungen</text>
    <text x="467" y="350">zurückblättern, 0 = Original</text>
    <text x="467" y="380"><tspan font-weight="bold">Kopieren:</tspan> Code in die Zwischenablage</text>
  </g>
</svg>
